[package]
name = "thinkingdata"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Rust SDK for ThinkingData Analytics (TE): API entry (blocking & async) plus the `thinkingdata` CLI. Functional logic lives in thinkingdata-core."

[features]
default = ["blocking"]
# Re-export the synchronous API (`Consumer`, `TDAnalytics`) and build the CLI.
blocking = ["thinkingdata-core/blocking", "dep:clap"]
# Re-export the asynchronous API (`AsyncConsumer`, `TDAnalyticsAsync`).
async = ["thinkingdata-core/async"]
# Both API styles at once.
full = ["blocking", "async"]

[dependencies]
clap = { workspace = true, optional = true }
serde_json = { workspace = true }
thinkingdata-core = { workspace = true }

[[bin]]
name = "thinkingdata"
path = "src/main.rs"
required-features = ["blocking"]

[[example]]
name = "quickstart"
required-features = ["blocking"]
