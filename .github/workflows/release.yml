name: Release

on:
  # Trigger on version tags: v0.1.0, v1.2.3, etc.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Manual dispatch with version input
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to validate or publish (e.g. 0.1.0)."
        required: true
        type: string
      dry_run:
        description: "Dry run — skip crates.io publish and GitHub release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: thinkingdata-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  # ── Resolve & verify version ────────────────────────────────────────────────

  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_dry_run: ${{ steps.version.outputs.is_dry_run }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && format('refs/tags/v{0}', inputs.version) || github.sha }}

      - name: Record release revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve version from the workspace manifest
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          # Dependency versions live in [workspace.package] of the root manifest.
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test -n "$VERSION" || { echo "::error::workspace Cargo.toml version not found"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_EVENT" = "push" ]; then
            case "$RELEASE_REF" in
              "v$VERSION") ;;
              *) echo "::error::tag $RELEASE_REF does not match workspace version $VERSION"; exit 1 ;;
            esac
          fi
          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$VERSION" ]; then
            echo "::error::requested version $REQUESTED_VERSION != workspace version $VERSION"; exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_dry_run=$RELEASE_DRY_RUN" >> "$GITHUB_OUTPUT"

  # ── Full test gate ──────────────────────────────────────────────────────────

  test:
    name: Test (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Build (default)
        run: cargo build --locked --workspace
      - name: Test (default)
        run: cargo test --locked --workspace
      - name: Test (all features, blocking + async)
        run: cargo test --locked --workspace --all-features
      - name: Build (no default features)
        run: cargo build --locked --workspace --no-default-features
      - name: Build (release)
        run: cargo build --locked --release --workspace

  # ── Lint gate ───────────────────────────────────────────────────────────────

  lint:
    name: Lint
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify the core package archive
        run: cargo package --locked -p thinkingdata-core --allow-dirty --no-verify
      # The facade cannot be packaged before `thinkingdata-core` exists on
      # crates.io (dependency resolution needs it), so its archive and build
      # are verified by the publish job itself.

  # ── Build platform binaries ─────────────────────────────────────────────────

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: tar.gz, strip: "true" }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, archive: tar.gz, strip: "true", install: "musl-tools" }
          - { os: macos-latest,   target: aarch64-apple-darwin,      archive: tar.gz, strip: "true" }
          - { os: macos-latest,   target: x86_64-apple-darwin,       archive: tar.gz, strip: "true" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    archive: zip,    strip: "false" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.install == 'musl-tools'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --locked --release --workspace --target ${{ matrix.target }}

      - name: Strip binary
        if: matrix.strip == 'true'
        shell: bash
        run: |
          EXT=""
          [ "${{ matrix.os }}" = "windows-latest" ] && EXT=".exe" || true
          strip "target/${{ matrix.target }}/release/thinkingdata$EXT"

      - name: Prepare archive directory
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          STAGE="thinkingdata-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          EXT=""
          [ "${{ matrix.os }}" = "windows-latest" ] && EXT=".exe" || true
          cp "target/${{ matrix.target }}/release/thinkingdata$EXT" "$STAGE/thinkingdata$EXT"
          cp README.md LICENSE "$STAGE/"
          echo "stage=$STAGE" >> "$GITHUB_ENV"

      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          # bsdtar on all runners infers the format from the extension (-a).
          tar -a -cf "thinkingdata-${VERSION}-${{ matrix.target }}.${{ matrix.archive }}" "$stage"

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCHIVE="thinkingdata-${VERSION}-${{ matrix.target }}.${{ matrix.archive }}"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thinkingdata-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: |
            thinkingdata-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            thinkingdata-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          retention-days: 14

  # ── Publish to crates.io ────────────────────────────────────────────────────

  publish:
    name: Publish to crates.io
    needs: [ prepare, test, lint ]
    if: needs.prepare.outputs.is_dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # thinkingdata-core must be published before the facade crate that
      # depends on it.
      - name: Publish thinkingdata-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p thinkingdata-core

      - name: Wait for the crates.io index to settle
        run: sleep 30

      - name: Publish thinkingdata (API + CLI)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p thinkingdata

  # ── GitHub Release ──────────────────────────────────────────────────────────
  # Deliberately independent of `publish`: a missing or expired
  # CARGO_REGISTRY_TOKEN must not withhold the platform binaries and release
  # notes; crates.io publishing can be retried via workflow_dispatch.

  github-release:
    name: GitHub Release
    needs: [ prepare, test, lint, build-binaries ]
    if: >-
      !cancelled() &&
      needs.prepare.outputs.is_dry_run != 'true' &&
      needs.test.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.build-binaries.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'HEADER'
          ## thinkingdata v${RELEASE_VERSION}

          Rust SDK and CLI for ThinkingData Analytics: blocking & async APIs, log/batch/debug consumers.

          ### Downloads
          HEADER
          for f in dist/*.tar.gz dist/*.zip; do
            base=$(basename "$f")
            echo "- \`$base\`" >> /tmp/release-notes.md
          done
          cat >> /tmp/release-notes.md <<'FOOTER'

          ### Verify
          ```bash
          sha256sum -c thinkingdata-${RELEASE_VERSION}-<target>.tar.gz.sha256
          ```

          ### Quick start
          ```bash
          ./thinkingdata --log-dir ./ta-logs track \
            --account-id acc_1 --event-name purchase \
            --properties '{"price": 9.9}'
          ./thinkingdata --server-url https://receiver.thinkingdata.io --app-id YOUR_APP_ID \
            user-set --account-id acc_1 --properties '{"vip": true}'
          ```
          FOOTER
          # Expand the two variables inside the heredocs.
          sed -e "s/\${RELEASE_VERSION}/${RELEASE_VERSION}/g" /tmp/release-notes.md > /tmp/release-notes.final.md
          cat /tmp/release-notes.final.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: v${{ needs.prepare.outputs.version }}
          body_path: /tmp/release-notes.final.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  # ── Dry run summary ─────────────────────────────────────────────────────────

  dry-run-summary:
    name: Dry Run Summary
    needs: [ prepare, test, lint, build-binaries ]
    if: needs.prepare.outputs.is_dry_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Summary
        run: |
          {
            echo "## 🏷️ Dry Run Complete"
            echo ""
            echo "- **Version**: \`${{ needs.prepare.outputs.version }}\`"
            echo "- **Tag**: \`${{ needs.prepare.outputs.tag }}\`"
            echo "- Tests: ✅ passed"
            echo "- Lint: ✅ passed"
            echo "- Binaries: ✅ built for 5 targets"
            echo ""
            echo "To publish for real, re-run with **dry_run** unchecked."
          } >> "$GITHUB_STEP_SUMMARY"
