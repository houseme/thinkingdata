name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Daily catch-up with Rust toolchain regressions
  schedule:
    - cron: "17 03 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# ── Build & Test ─────────────────────────────────────────────────────────────
#
# Feature matrix of the workspace:
#   default            → `blocking` (sync API + CLI binary)
#   all                → blocking + async
#   no-default-features→ data model, logging and validation only
#   async-only         → async API (streaming pipelines), no blocking facade

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        features: [ default, all, no-default-features, async-only ]
        include:
          - features: "default"
            flags: ""
          - features: "all"
            flags: "--all-features"
          - features: "no-default-features"
            flags: "--no-default-features"
          - features: "async-only"
            flags: "--no-default-features --features thinkingdata-core/async,thinkingdata/async"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keep feature-specific output checks independent of cached builds.
          key: test-${{ matrix.features }}

      - name: Build (lib + bin)
        run: cargo build --locked ${{ matrix.flags }} --workspace --all-targets

      - name: Verify the library and the CLI binary are both produced
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'default'
        run: |
          test -f target/debug/thinkingdata || { echo "bin target missing"; exit 1; }
          test -f target/debug/libthinkingdata_core.rlib || { echo "core lib target missing"; exit 1; }
          ./target/debug/thinkingdata --version

      - name: Verify the library-only build produces no binary
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'no-default-features'
        run: test ! -e target/debug/thinkingdata

      - name: Verify async-only still produces no binary (CLI requires blocking)
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'async-only'
        run: test ! -e target/debug/thinkingdata

      - name: Test
        run: cargo test --locked ${{ matrix.flags }} --workspace

  # ── Functional smoke: CLI end to end against the log consumer ────────────────

  smoke:
    name: Functional smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release -p thinkingdata --bins

      - name: Exercise the CLI end to end
        shell: bash
        run: |
          set -euo pipefail
          BIN=./target/release/thinkingdata

          "$BIN" --version

          # Track + user operations land as NDJSON lines in the log directory.
          DIR=$(mktemp -d)
          "$BIN" --log-dir "$DIR" track \
            --account-id acc_1 --event-name purchase \
            --properties '{"price": 9.9, "product_name": "book"}'
          "$BIN" --log-dir "$DIR" user-set --account-id acc_1 --properties '{"vip": true}'
          "$BIN" --log-dir "$DIR" track --distinct-id dev_9 --event-name anonymous_view
          "$BIN" --log-dir "$DIR" track-first --account-id acc_1 \
            --event-name register --first-check-id acc_1

          FILE=$(find "$DIR" -type f -name 'log.*' | head -n1)
          test -n "$FILE"
          grep -q '"#type":"track"' "$FILE"
          grep -q '"#event_name":"purchase"' "$FILE"
          grep -q '"user_set"' "$FILE"
          grep -q '"#first_check_id":"acc_1"' "$FILE"
          grep -q '"#lib":"Rust"' "$FILE"

          # Errors exit non-zero: missing consumer, missing IDs, empty keys.
          rc=0; "$BIN" track --account-id acc_1 --event-name x >/dev/null 2>&1 || rc=$?
          test "$rc" -ne 0
          rc=0; "$BIN" --log-dir "$DIR" track --event-name x >/dev/null 2>&1 || rc=$?
          test "$rc" -ne 0

  # ── Lint: fmt + clippy quality gates across the feature matrix ───────────────

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (default features, all targets, -D warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Clippy (all features, all targets, -D warnings)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Clippy (no default features, all targets, -D warnings)
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings

      - name: Clippy (async only, all targets, -D warnings)
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features thinkingdata-core/async,thinkingdata/async -- -D warnings

  # ── Documentation ───────────────────────────────────────────────────────────

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check doc warnings
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Cross-compilation (musl, static CLI binary) ─────────────────────────────

  cross-musl:
    name: Cross (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (musl, static, default features)
        run: cargo build --locked --release --workspace --target x86_64-unknown-linux-musl

      - name: Build (musl, static, all features)
        run: cargo build --locked --release --workspace --all-features --target x86_64-unknown-linux-musl
