[workspace]
resolver = "2"
members = ["thinkingdata", "thinkingdata-core"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/houseme/thinkingdata"
keywords = ["thinkingdata", "analytics", "sdk", "tracking", "te"]
categories = ["api-bindings"]

# All dependencies are managed centrally here; member crates reference them
# with `dep = { workspace = true }`.
[workspace.dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.8", features = ["derive"] }
flate2 = "1.1.11"
jiff = "1.0.0"
regex = "1.13.1"
# reqwest 0.13 defaults to rustls backed by the aws-lc-rs crypto provider as
# its only TLS backend; no native-tls/openssl backend is enabled. `ring` and
# `openssl-probe` still appear in the dependency tree as unused transitive
# dependencies (via quinn / rustls-native-certs), but no TLS traffic is
# processed by them.
reqwest = { version = "0.13.5", features = ["form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# The version is required so the facade crate can be published to crates.io,
# where the `path` specification is dropped.
thinkingdata-core = { path = "thinkingdata-core", version = "0.1.1" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
